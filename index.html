          &quot;&lt;li&gt;&lt;strong&gt;Tipo:&lt;/strong&gt;&lt;span&gt;&quot; +
          escHtml(property.tipo) +
          &quot;&lt;/span&gt;&lt;/li&gt;&quot; +
          &quot;&lt;li&gt;&lt;strong&gt;Capacidade:&lt;/strong&gt;&lt;span&gt;&quot; +
          escHtml(property.capacidade) +
          &quot;&lt;/span&gt;&lt;/li&gt;&quot; +
          &quot;&lt;li&gt;&lt;strong&gt;Quartos:&lt;/strong&gt;&lt;span&gt;&quot; +
          escHtml(property.quartos) +
          &quot;&lt;/span&gt;&lt;/li&gt;&quot; +
          &quot;&lt;li&gt;&lt;strong&gt;Banheiros:&lt;/strong&gt;&lt;span&gt;&quot; +
          escHtml(property.banheiros) +
          &quot;&lt;/span&gt;&lt;/li&gt;&quot; +
          &quot;&lt;li&gt;&lt;strong&gt;Vagas:&lt;/strong&gt;&lt;span&gt;&quot; +
          escHtml(property.vagas) +
          &quot;&lt;/span&gt;&lt;/li&gt;&quot; +
          &quot;&lt;li&gt;&lt;strong&gt;Valor:&lt;/strong&gt;&lt;span&gt;&quot; +
          escHtml(property.preco) +
          &quot;&lt;/span&gt;&lt;/li&gt;&quot; +
          &quot;&lt;li&gt;&lt;strong&gt;Locação:&lt;/strong&gt;&lt;span&gt;&quot; +
          escHtml(property.minimo) +
          &quot;&lt;/span&gt;&lt;/li&gt;&quot; +
          &quot;&lt;li&gt;&lt;strong&gt;Check-in:&lt;/strong&gt;&lt;span&gt;&quot; +
          escHtml(property.checkin) +
          &quot;&lt;/span&gt;&lt;/li&gt;&quot; +
          &quot;&lt;li&gt;&lt;strong&gt;Check-out:&lt;/strong&gt;&lt;span&gt;&quot; +
          escHtml(property.checkout) +
          &quot;&lt;/span&gt;&lt;/li&gt;&quot; +
          &quot;&lt;/ul&gt;&quot; +
          &#39;&lt;div class=&quot;cta-group&quot;&gt;&#39; +
          &#39;&lt;a class=&quot;cta&quot; href=&quot;&#39; +
          escAttr(whatsappLink) +
          &#39;&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; aria-label=&quot;&#39; +
          escAttr(&quot;Falar no WhatsApp sobre &quot; + property.nome) +
          &#39;&quot;&gt;Falar no WhatsApp&lt;/a&gt;&#39; +
          botaoImagens(property, index, pageLink) +
          &quot;&lt;/div&gt;&quot; +
          &quot;&lt;/div&gt;&quot; +
          &quot;&lt;/article&gt;&quot;
        );
      }

      function botaoImagens(property, index, pageLink) {
        const temGaleria = Array.isArray(property.galeria) &amp;&amp; property.galeria.length &gt; 0;
        if (temGaleria) {
          return (
            &#39;&lt;button type=&quot;button&quot; class=&quot;cta secondary abrir-galeria&quot; data-imovel-index=&quot;&#39; +
            index +
            &#39;&quot; aria-label=&quot;&#39; +
            escAttr(&quot;Ver fotos de &quot; + property.nome) +
            &#39;&quot;&gt;Ver Imagens&lt;/button&gt;&#39;
          );
        }
        return (
          &#39;&lt;a class=&quot;cta secondary&quot; href=&quot;&#39; +
          escAttr(pageLink) +
          &#39;&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot; aria-label=&quot;&#39; +
          escAttr(&quot;Ver página completa de &quot; + property.nome) +
          &#39;&quot;&gt;Ver página do imóvel&lt;/a&gt;&#39;
        );
      }

      lista.innerHTML = CLICKPRAIA_DATA.imoveis.map((p, i) =&gt; buildCard(p, i)).join(&quot;&quot;);

      // ---- Galeria de fotos (popup &quot;Ver Imagens&quot;) ----
      const galeriaModal = document.getElementById(&quot;galeria-modal&quot;);
      const galeriaImg = document.getElementById(&quot;galeria-img&quot;);
      const galeriaTitulo = document.getElementById(&quot;galeria-titulo&quot;);
      const galeriaContador = document.getElementById(&quot;galeria-contador&quot;);
      const galeriaDots = document.getElementById(&quot;galeria-dots&quot;);
      const galeriaStatus = document.getElementById(&quot;galeria-status&quot;);
      const galeriaFechar = document.getElementById(&quot;galeria-fechar&quot;);
      const galeriaPrev = document.getElementById(&quot;galeria-prev&quot;);
      const galeriaNext = document.getElementById(&quot;galeria-next&quot;);

      let galeriaFotos = [];
      let galeriaIndex = 0;
      let galeriaNomeImovel = &quot;&quot;;
      let galeriaGatilho = null;
      let galeriaScrollY = 0;
      let galeriaAncorada = false;

      // Dentro do Google Sites a página vira um iframe. Se o iframe tiver rolagem
      // propria, o popup pode ser fixo normalmente; se o iframe mostrar todo o
      // conteudo de uma vez (quem rola e a pagina do Sites, por fora), o popup
      // precisa ser ancorado na altura do card clicado para nao sair de vista.
      function temRolagemInterna() {
        return document.documentElement.scrollHeight &gt; window.innerHeight + 4;
      }

      function travarScrollFundo() {
        galeriaScrollY = window.scrollY || document.documentElement.scrollTop || 0;
        document.body.style.position = &quot;fixed&quot;;
        document.body.style.top = &quot;-&quot; + galeriaScrollY + &quot;px&quot;;
        document.body.style.left = &quot;0&quot;;
        document.body.style.right = &quot;0&quot;;
        document.body.style.width = &quot;100%&quot;;
      }

      function destravarScrollFundo() {
        document.body.style.position = &quot;&quot;;
        document.body.style.top = &quot;&quot;;
        document.body.style.left = &quot;&quot;;
        document.body.style.right = &quot;&quot;;
        document.body.style.width = &quot;&quot;;
        window.scrollTo(0, galeriaScrollY);
      }

      function preloadFoto(src) {
        if (!src) return;
        const img = new Image();
        img.src = src;
      }

      function renderGaleriaFoto() {
        const foto = galeriaFotos[galeriaIndex];
        if (!foto) return;
        galeriaImg.src = foto.src;
        galeriaImg.alt = foto.alt || galeriaNomeImovel + &quot; - foto &quot; + (galeriaIndex + 1);
        galeriaContador.textContent = galeriaIndex + 1 + &quot; de &quot; + galeriaFotos.length;
        galeriaStatus.textContent =
          &quot;Foto &quot; + (galeriaIndex + 1) + &quot; de &quot; + galeriaFotos.length + &quot;: &quot; + (foto.alt || galeriaNomeImovel);
        galeriaDots.querySelectorAll(&quot;.galeria-dot&quot;).forEach((dot, i) =&gt; {
          dot.setAttribute(&quot;aria-current&quot;, i === galeriaIndex ? &quot;true&quot; : &quot;false&quot;);
        });
        preloadFoto((galeriaFotos[galeriaIndex + 1] || galeriaFotos[0]).src);
        preloadFoto((galeriaFotos[galeriaIndex - 1] || galeriaFotos[galeriaFotos.length - 1]).src);
      }

      function proximaFoto() {
        galeriaIndex = (galeriaIndex + 1) % galeriaFotos.length;
        renderGaleriaFoto();
      }

      function fotoAnterior() {
        galeriaIndex = (galeriaIndex - 1 + galeriaFotos.length) % galeriaFotos.length;
        renderGaleriaFoto();
      }

      function onGaleriaKeydown(event) {
        if (event.key === &quot;Escape&quot;) {
          fecharGaleria();
          return;
        }
        if (event.key === &quot;ArrowRight&quot;) {
          proximaFoto();
          return;
        }
        if (event.key === &quot;ArrowLeft&quot;) {
          fotoAnterior();
          return;
        }
        if (event.key === &quot;Tab&quot;) {
          const focaveis = Array.prototype.slice.call(galeriaModal.querySelectorAll(&quot;button&quot;));
          const primeiro = focaveis[0];
          const ultimo = focaveis[focaveis.length - 1];
          if (event.shiftKey &amp;&amp; document.activeElement === primeiro) {
            event.preventDefault();
            ultimo.focus();
          } else if (!event.shiftKey &amp;&amp; document.activeElement === ultimo) {
            event.preventDefault();
            primeiro.focus();
          }
        }
      }

      function abrirGaleria(property, gatilho) {
        if (!Array.isArray(property.galeria) || !property.galeria.length) return;
        galeriaFotos = property.galeria;
        galeriaNomeImovel = property.nome;
        galeriaIndex = 0;
        galeriaGatilho = gatilho || null;
        galeriaTitulo.textContent = property.nome;
        galeriaDots.innerHTML = galeriaFotos
          .map(function (_, i) {
            return &#39;&lt;button type=&quot;button&quot; class=&quot;galeria-dot&quot; aria-label=&quot;Ver foto &#39; + (i + 1) + &#39;&quot;&gt;&lt;/button&gt;&#39;;
          })
          .join(&quot;&quot;);
        galeriaDots.querySelectorAll(&quot;.galeria-dot&quot;).forEach((dot, i) =&gt; {
          dot.addEventListener(&quot;click&quot;, () =&gt; {
            galeriaIndex = i;
            renderGaleriaFoto();
          });
        });
        renderGaleriaFoto();
        galeriaAncorada = !temRolagemInterna();
        if (galeriaAncorada) {
          // iframe sem rolagem propria: ancora o popup na altura do card clicado
          const alvo = gatilho &amp;&amp; gatilho.closest ? gatilho.closest(&quot;.card&quot;) : null;
          const topoAlvo = alvo
            ? alvo.getBoundingClientRect().top + (window.scrollY || 0)
            : 0;
          galeriaModal.classList.add(&quot;ancorado&quot;);
          galeriaModal.style.top = Math.max(0, Math.round(topoAlvo)) + &quot;px&quot;;
          galeriaModal.hidden = false;
        } else {
          galeriaModal.classList.remove(&quot;ancorado&quot;);
          galeriaModal.style.top = &quot;&quot;;
          galeriaModal.hidden = false;
          travarScrollFundo();
        }
        galeriaFechar.focus();
        document.addEventListener(&quot;keydown&quot;, onGaleriaKeydown);
      }

      function fecharGaleria() {
        galeriaModal.hidden = true;
        galeriaModal.classList.remove(&quot;ancorado&quot;);
        galeriaModal.style.top = &quot;&quot;;
        if (!galeriaAncorada) destravarScrollFundo();
        galeriaAncorada = false;
        document.removeEventListener(&quot;keydown&quot;, onGaleriaKeydown);
        if (galeriaGatilho &amp;&amp; typeof galeriaGatilho.focus === &quot;function&quot;) {
          galeriaGatilho.focus();
        }
      }

      galeriaFechar.addEventListener(&quot;click&quot;, fecharGaleria);
      galeriaNext.addEventListener(&quot;click&quot;, proximaFoto);
      galeriaPrev.addEventListener(&quot;click&quot;, fotoAnterior);
      galeriaModal.addEventListener(&quot;click&quot;, (event) =&gt; {
        if (event.target === galeriaModal) fecharGaleria();
      });

      let galeriaToqueX = null;
      galeriaModal.addEventListener(
        &quot;touchstart&quot;,
        (event) =&gt; {
          galeriaToqueX = event.changedTouches[0].clientX;
        },
        { passive: true }
      );
      galeriaModal.addEventListener(
        &quot;touchend&quot;,
        (event) =&gt; {
          if (galeriaToqueX === null) return;
          const delta = event.changedTouches[0].clientX - galeriaToqueX;
          if (Math.abs(delta) &gt; 40) {
            if (delta &lt; 0) proximaFoto();
            else fotoAnterior();
          }
          galeriaToqueX = null;
        },
        { passive: true }
      );

      lista.addEventListener(&quot;click&quot;, (event) =&gt; {
        const gatilho = event.target.closest(&quot;.abrir-galeria&quot;);
        if (!gatilho) return;
        const idx = Number(gatilho.getAttribute(&quot;data-imovel-index&quot;));
        const property = CLICKPRAIA_DATA.imoveis[idx];
        if (property) abrirGaleria(property, gatilho);
      });

      // ---- Modo embed (Google Sites) ----
      function ajustarModoEmbed() {
        if (galeriaModal &amp;&amp; !galeriaModal.hidden) return;
        document.body.classList.toggle(&quot;sem-rolagem-interna&quot;, !temRolagemInterna());
      }

      ajustarModoEmbed();
      window.addEventListener(&quot;resize&quot;, ajustarModoEmbed);
      window.addEventListener(&quot;load&quot;, ajustarModoEmbed);

      const jsonLd = {
        &quot;@context&quot;: &quot;https://schema.org&quot;,
        &quot;@type&quot;: &quot;ItemList&quot;,
        itemListElement: CLICKPRAIA_DATA.imoveis.map((property, index) =&gt; ({
          &quot;@type&quot;: &quot;ListItem&quot;,
          position: index + 1,
          item: {
            &quot;@type&quot;: &quot;LodgingBusiness&quot;,
            name: property.nome,
            description: property.descricao,
            areaServed: property.praia,
            url: property.pagina || &quot;&quot;,
            offers: {
              &quot;@type&quot;: &quot;Offer&quot;,
              priceCurrency: &quot;BRL&quot;,
              price: (String(property.preco || &quot;&quot;).match(/\d+/g) || [&quot;0&quot;]).join(&quot;&quot;),
              availability: &quot;https://schema.org/InStock&quot;
            }
          }
        }))
      };

      const schemaTag = document.createElement(&quot;script&quot;);
      schemaTag.type = &quot;application/ld+json&quot;;
      schemaTag.text = JSON.stringify(jsonLd);
      document.head.appendChild(schemaTag);
    })();
  &lt;/script&gt;
